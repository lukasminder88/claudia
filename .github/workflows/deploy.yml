name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents:write genügt – wir veröffentlichen über den gh-pages-Branch und
# brauchen NICHT die (für die Integration gesperrte) Pages-API.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      - name: Auf gh-pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
