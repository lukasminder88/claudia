# Browser-Fassung im Intranet ausliefern (nginx).
#
#   sudo cp -r public /var/www/offerttool
#   sudo cp deploy/nginx-offerttool.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Dieselben Kopfzeilen wie in netlify.toml: die Seite darf nur vom eigenen
# Server laden (die Gerätedatenblätter), sonst nichts.

server {
    listen 80;
    server_name offerttool.intern;          # an die eigene Zone anpassen

    root /var/www/offerttool;
    index index.html;

    # .dotx wird sonst als application/octet-stream ausgeliefert; der Browser
    # liest sie ohnehin selbst, aber ein passender Typ hilft beim Debuggen.
    types {
        text/html                                                                 html;
        application/json                                                          json;
        application/zip                                                           zip;
        application/vnd.openxmlformats-officedocument.wordprocessingml.template   dotx;
        application/vnd.openxmlformats-officedocument.wordprocessingml.document   docx;
        image/svg+xml                                                             svg;
    }
    default_type application/octet-stream;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'" always;

    # Die Datenblätter sind Geschäftsunterlagen. Im Intranet genügt meist die
    # Netzgrenze; wer mehr will, schaltet hier eine Anmeldung davor.
    # location /datenblaetter/ {
    #     auth_basic "Offerttool";
    #     auth_basic_user_file /etc/nginx/offerttool.htpasswd;
    # }

    location / {
        try_files $uri $uri/ =404;
    }
}
