<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="Aufbau: Excel-Vorlage erzeugt Fixtures und Listen; der Rechenkern wird gegen die Fixtures geprueft und von der Web-Maske genutzt.">
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8794"/>
    </marker>
    <style>
      .kasten { fill: none; stroke: #7b8794; stroke-width: 1.5; rx: 8; }
      .quelle { stroke: #4d9bea; stroke-width: 2; }
      .titel { font: 600 14px "Segoe UI", system-ui, sans-serif; fill: #7b8794; }
      .zeile { font: 12px "Segoe UI", system-ui, sans-serif; fill: #7b8794; }
      .kante { stroke: #7b8794; stroke-width: 1.5; fill: none; marker-end: url(#pfeil); }
      .kante-text { font: 11px "Segoe UI", system-ui, sans-serif; fill: #7b8794; }
      .akzent { fill: #4d9bea; }
    </style>
  </defs>

  <rect class="kasten quelle" x="16" y="104" width="176" height="92"/>
  <text class="titel akzent" x="34" y="132">Excel-Vorlage</text>
  <text class="zeile" x="34" y="152">Q4 2025 rev. 1</text>
  <text class="zeile" x="34" y="170">die Spezifikation</text>

  <rect class="kasten" x="256" y="26" width="188" height="86"/>
  <text class="titel" x="274" y="54">spec/fixtures</text>
  <text class="zeile" x="274" y="74">48 Fälle, von</text>
  <text class="zeile" x="274" y="92">LibreOffice gerechnet</text>

  <rect class="kasten" x="256" y="188" width="188" height="86"/>
  <text class="titel" x="274" y="216">src/i18n</text>
  <text class="zeile" x="274" y="236">Listen aus dem</text>
  <text class="zeile" x="274" y="254">Blatt «Listen», de/fr</text>

  <rect class="kasten" x="508" y="104" width="164" height="92"/>
  <text class="titel" x="526" y="132">src/engine</text>
  <text class="zeile" x="526" y="152">reine Funktionen,</text>
  <text class="zeile" x="526" y="170">Regelwerk versioniert</text>

  <rect class="kasten" x="712" y="104" width="132" height="92"/>
  <text class="titel" x="730" y="132">src/ui</text>
  <text class="zeile" x="730" y="152">Maske,</text>
  <text class="zeile" x="730" y="170">Live-Berechnung</text>

  <path class="kante" d="M 192 132 L 240 132 L 240 69 L 250 69"/>
  <path class="kante" d="M 192 168 L 240 168 L 240 231 L 250 231"/>
  <text class="kante-text" x="196" y="106">erzeugt</text>

  <path class="kante" d="M 444 69 L 486 69 L 486 144 L 502 144"/>
  <text class="kante-text" x="452" y="60">prüft</text>

  <path class="kante" d="M 444 231 L 486 231 L 486 176 L 502 176"/>

  <path class="kante" d="M 672 150 L 706 150"/>
  <path class="kante" d="M 706 168 L 672 168"/>
  <text class="kante-text" x="676" y="128">Eingabe</text>
  <text class="kante-text" x="676" y="192">Ergebnis</text>
</svg>
