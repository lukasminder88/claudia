# Netlify-Konfiguration für den Machbarkeitsnachweis "Kalkulationstool 2.0".
# Gebaut und veröffentlicht wird nur das Unterverzeichnis kalkulationstool/.

[build]
  base = "kalkulationstool"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Eine einzelne Seite: alles, was nicht als Datei existiert, zeigt die Maske.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    # Der PoC lädt nichts nach: keine Fremdskripte, keine Netzwerkaufrufe.
    Content-Security-Policy = "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

# Gehashte Dateinamen dürfen dauerhaft im Cache bleiben.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
