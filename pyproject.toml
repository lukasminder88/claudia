[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offerttool"
version = "3.0.0"
description = "Regelbasierte Generierung einer Offerte aus Kalktool-Dateien – ohne KI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=7.4"]

[project.scripts]
offerttool = "offerttool.cli:main"

[tool.setuptools]
packages = ["offerttool", "offerttool.docxutil"]

[tool.setuptools.package-data]
offerttool = ["resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
