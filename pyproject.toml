[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offerttool"
version = "3.0.0"
description = "Regelbasierte Generierung einer Offerte aus Kalktool-Dateien – ohne KI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=7.4", "httpx>=0.27"]

[project.scripts]
offerttool = "offerttool.cli:main"

[tool.setuptools]
packages = ["offerttool", "offerttool.docxutil", "offerttool.web"]

[tool.setuptools.package-data]
offerttool = ["resources/*.yaml", "resources/*.docx", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
